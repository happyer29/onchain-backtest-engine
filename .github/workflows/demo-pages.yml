name: Static demo / GitHub Pages

# Local preparation does not publish. Even a manual run defaults to verification only.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified static site to GitHub Pages
        type: boolean
        required: true
        default: false
      dataset:
        description: Synthetic root, or historical root plus a separate Copy Buy demo
        type: choice
        required: true
        default: synthetic
        options:
          - synthetic
          - historical
      data_release_tag:
        description: Historical data release tag (asset pages-history-data.tar.gz)
        type: string
        required: false
      data_sha256:
        description: SHA-256 of the historical data archive (required for historical)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: static-demo-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --all-groups --frozen
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --prefix frontend
      - name: Verify the historical archive import boundary
        run: uv run pytest -q tests/architecture/test_static_history_import.py
      - name: Verify closed-distribution composition and frontend transport
        run: |
          node --test frontend/scripts/compose-pages.node-test.mjs
          npm --prefix frontend test
      - name: Install test browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Generate only synthetic examples, with network connections disabled
        run: npm --prefix frontend run demo:prepare
      - name: Build the independent synthetic distribution
        run: npm --prefix frontend run demo:build
      - name: Verify synthetic results at their intended public path
        env:
          BACKTEST_DEMO_BASE_PATH: ${{ inputs.dataset == 'historical' && '/onchain-backtest-engine/copy-buy/' || '/onchain-backtest-engine/' }}
        run: npm --prefix frontend run demo:test
      - name: Keep the verified Copy Buy distribution separate
        if: inputs.dataset == 'historical'
        run: mv frontend/demo-dist frontend/demo-synthetic-dist
      - name: Download the explicitly pinned historical presentation export
        if: inputs.dataset == 'historical'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DATA_RELEASE_TAG: ${{ inputs.data_release_tag }}
          DATA_SHA256: ${{ inputs.data_sha256 }}
        run: |
          [[ "$DATA_RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || { echo 'Invalid historical release tag'; exit 1; }
          [[ "$DATA_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'A lowercase SHA-256 is required for historical data'; exit 1; }
          gh release download "$DATA_RELEASE_TAG" --pattern pages-history-data.tar.gz --dir "$RUNNER_TEMP/history-data"
          uv run python frontend/scripts/import-history.py --archive "$RUNNER_TEMP/history-data/pages-history-data.tar.gz" --sha256 "$DATA_SHA256"
      - name: Build the independent historical distribution
        if: inputs.dataset == 'historical'
        run: npm --prefix frontend run demo:build
      - name: Verify historical results at the project root
        if: inputs.dataset == 'historical'
        run: npm --prefix frontend run demo:test
      - name: Compose the verified historical root and synthetic Copy Buy child
        if: inputs.dataset == 'historical'
        run: node frontend/scripts/compose-pages.mjs frontend/demo-dist frontend/demo-synthetic-dist frontend/pages-dist
      - name: Configure existing Pages site
        if: inputs.publish
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload only the verified static directory
        if: inputs.publish
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ inputs.dataset == 'historical' && 'frontend/pages-dist' || 'frontend/demo-dist' }}

  deploy:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified static results
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
