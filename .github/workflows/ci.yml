name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.13 / ${{ matrix.label }} quality gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # Report each admitted platform independently even when another platform fails.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Exercise the full gate on both supported native host architectures.
          - label: Linux x86_64
            os: ubuntu-latest
            machine: x86_64
          # Use the standard arm64 runner for the native macOS support contract.
          - label: macOS arm64
            os: macos-15
            machine: arm64

    steps:
      # Pin third-party actions to immutable commits; Dependabot proposes updates.
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true

      # The project supports exactly Python 3.13 and a frozen dependency graph.
      - name: Install Python
        run: uv python install 3.13

      - name: Verify lockfile
        run: uv lock --check

      - name: Sync environment
        run: uv sync --all-groups --frozen

      # Runner labels must resolve to the architecture admitted by the release contract.
      - name: Verify native architecture
        run: uv run python -c 'import platform; assert platform.machine() == "${{ matrix.machine }}"'

      # Keep the hosted gate byte-for-byte aligned with the documented local gate.
      - name: Check formatting
        run: uv run ruff format --check src tests

      - name: Lint
        run: uv run ruff check src tests

      - name: Type-check
        run: uv run mypy src/backtest

      - name: Verify import boundaries
        run: uv run lint-imports

      - name: Test with coverage
        run: uv run pytest --cov=backtest --cov-report=term-missing

      # The standalone helper is release tooling outside the application/test source roots.
      - name: Check release helper
        run: |
          uv run ruff format --check scripts/smoke-installed-wheel.py
          uv run ruff check scripts/smoke-installed-wheel.py

      # Exercise package metadata, wheel contents and the installed CLI entry point.
      - name: Build distributions
        run: uv build

      - name: Smoke-test installed wheel outside checkout
        run: uv run python scripts/smoke-installed-wheel.py dist/*.whl

  native-platform-smoke:
    name: ${{ matrix.label }} smoke
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux native
            os: ubuntu-latest
          - label: macOS native
            os: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Sync runtime environment
        run: uv sync --frozen

      - name: Smoke-test package and default profile
        run: |
          uv run backtest --help
          uv run python -c 'from pathlib import Path; from backtest.bootstrap.config import load_settings; load_settings(Path("configs/local-16gb.toml"))'

  windows-wsl2-contract:
    name: Windows 11 / WSL2 host contract
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Native Win32 execution is intentionally unsupported. This job checks the
      # Windows-host entry point; the profile itself is exercised by the Linux job.
      - name: Validate PowerShell entry point
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $script = (Resolve-Path 'scripts/setup-windows-wsl2.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile(
            $script,
            [ref] $tokens,
            [ref] $errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
          if (-not (Test-Path 'configs/local-windows-wsl2-16gb.toml')) {
            throw 'The Windows/WSL2 profile is missing.'
          }

  windows-wsl2-profile-smoke:
    name: Windows 11 / WSL2 runtime profile
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Sync runtime environment
        run: uv sync --frozen

      - name: Validate WSL helper and profile
        run: |
          bash -n scripts/windows-wsl2-smoke.sh
          uv run python -c 'from pathlib import Path; from backtest.bootstrap.config import load_settings; load_settings(Path("configs/local-windows-wsl2-16gb.toml"))'
          uv run backtest --help
