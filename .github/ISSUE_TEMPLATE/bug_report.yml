name: Bug report
description: Report a reproducible problem without sensitive data
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not attach credentials, `.env`, private endpoints,
        wallet secrets, absolute paths, or unreviewed data dumps.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I checked the current documentation and existing issues.
          required: true
        - label: I removed secrets and sensitive source details from this report.
          required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Briefly describe the observable behavior.
      placeholder: The command exited with ...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide safe commands and inputs.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux x86_64
        - macOS arm64
        - Windows 11 x86_64 via WSL2/Ubuntu
        - Other / unsupported
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Safe diagnostics
      description: Add a redacted traceback/log and resource context when relevant.
      render: text
